name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_ref:
        description: Published tag or release commit to publish
        required: true
        type: string
      publish_root:
        description: Publish @briansunter/nib from release_ref
        required: true
        default: false
        type: boolean
      publish_images:
        description: Publish @briansunter/nib-images from release_ref
        required: true
        default: false
        type: boolean

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      image_release_created: >-
        ${{ steps.release.outputs['packages/nib-images--release_created'] }}
      image_tag_name: >-
        ${{ steps.release.outputs['packages/nib-images--tag_name'] }}
      # Image-only changes do not create the root tag. Fall back to the image
      # tag so the publish job always checks out the release commit.
      release_ref: >-
        ${{ steps.release.outputs.tag_name ||
        steps.release.outputs['packages/nib-images--tag_name'] }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  detect-current-release:
    name: Detect untagged package release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out current release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare package version with published tags
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "v${version} already exists; no fallback publish needed."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "v${version} is not published; the release job will publish this commit."
          fi

  publish:
    name: Publish to npm
    needs:
      - release-please
      - detect-current-release
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.publish_root || inputs.publish_images)) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-current-release.outputs.should_publish == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out released version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || needs.release-please.outputs.release_ref || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce pre-major version policy
        run: bun run check:version-policy

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Publish to npm with provenance
        if: >-
          (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_root)
        run: npm publish --provenance --access public

      - name: Publish @briansunter/nib-images to npm with provenance
        if: >-
          (github.event_name == 'push' && needs.release-please.outputs.image_release_created == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_images)
        working-directory: packages/nib-images
        run: npm publish --provenance --access public

      - name: Create fallback GitHub release
        if: github.event_name == 'push' && needs.detect-current-release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.detect-current-release.outputs.version }}
        run: gh release create "v${RELEASE_VERSION}" --target "$GITHUB_SHA" --title "v${RELEASE_VERSION}" --generate-notes
